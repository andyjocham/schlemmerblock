<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Schlemmerblock</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Schlemmerblock">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f2f6f3">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      color-scheme: light;
      --ink: #17201d;
      --muted: #65706b;
      --line: #dbe4df;
      --surface: #ffffff;
      --soft: #f2f6f3;
      --accent: #0e7662;
      --accent-2: #a54816;
      --leisure: #315f9d;
      --food: #b63f32;
      --cafe: #7c4f1d;
      --fast: #287056;
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--soft);
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-rows: 52svh 48svh;
      min-height: 100svh;
    }

    #map {
      grid-row: 1;
      width: 100%;
      height: 100%;
      background: #dce7e0;
      z-index: 1;
    }

    .panel {
      position: relative;
      grid-row: 2;
      z-index: 2;
      display: flex;
      flex-direction: column;
      min-height: 0;
      margin-top: -12px;
      border-radius: 14px 14px 0 0;
      border-top: 1px solid var(--line);
      background: var(--surface);
      box-shadow: 0 -12px 30px rgba(23, 32, 29, .14);
      overflow: hidden;
    }

    .panel::before {
      content: "";
      align-self: center;
      width: 44px;
      height: 4px;
      margin: 8px 0 6px;
      border-radius: 999px;
      background: #c5d0ca;
      flex: 0 0 auto;
    }

    header {
      padding: 0 14px 10px;
      border-bottom: 1px solid var(--line);
      flex: 0 0 auto;
    }

    .title-row {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 1.08rem;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .count {
      min-width: max-content;
      color: var(--muted);
      font-weight: 700;
      font-size: .85rem;
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    input, select, button {
      font: inherit;
    }

    .search {
      min-width: 0;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0 12px;
      color: var(--ink);
      background: var(--soft);
      outline: none;
    }

    .locate {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--accent);
      font-weight: 900;
    }

    .filters {
      display: grid;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      flex: 0 0 auto;
    }

    .select {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0 10px;
      color: var(--ink);
      background: #fff;
    }

    .chips {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .chips::-webkit-scrollbar { display: none; }

    .chip {
      flex: 0 0 auto;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 11px;
      background: #fff;
      color: var(--ink);
      font-weight: 700;
      font-size: .82rem;
      white-space: nowrap;
    }

    .chip.active {
      border-color: var(--accent);
      background: #e2f3ed;
      color: #075744;
    }

    .chip.done {
      border-color: #87928c;
      background: #eef2ef;
      color: #3f4844;
    }

    .results {
      min-height: 0;
      overflow-y: auto;
      padding: 10px 10px 18px;
      scroll-padding-bottom: 16px;
    }

    .result {
      display: grid;
      grid-template-columns: 6px 1fr auto;
      gap: 10px;
      align-items: start;
      padding: 12px 8px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
    }

    .result.visited {
      background: #f7f9f7;
    }

    .result.visited h2 {
      color: #66706b;
      text-decoration: line-through;
      text-decoration-thickness: 2px;
      text-decoration-color: #aab4ae;
    }

    .stripe {
      width: 6px;
      border-radius: 999px;
      background: var(--accent);
    }

    .result h2 {
      margin: 0 0 5px;
      font-size: .98rem;
      line-height: 1.22;
      letter-spacing: 0;
    }

    .meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      color: var(--muted);
      font-size: .8rem;
      line-height: 1.25;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      border-radius: 999px;
      padding: 2px 8px;
      background: var(--soft);
      color: var(--ink);
      font-size: .74rem;
      font-weight: 800;
    }

    .badge.new { background: #fff0df; color: var(--accent-2); }

    .visited-toggle {
      display: inline-grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-weight: 900;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .visited-toggle[aria-pressed="true"] {
      border-color: var(--accent);
      background: #dff2eb;
      color: #075744;
    }

    .empty {
      padding: 34px 16px;
      text-align: center;
      color: var(--muted);
      font-weight: 700;
    }

    .leaflet-popup-content-wrapper {
      border-radius: var(--radius);
    }

    .popup {
      min-width: 210px;
    }

    .popup strong {
      display: block;
      margin-bottom: 4px;
      line-height: 1.2;
    }

    .popup a {
      display: inline-flex;
      margin-top: 9px;
      color: var(--accent);
      font-weight: 800;
      text-decoration: none;
    }

    .marker {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border: 2px solid #fff;
      border-radius: 999px;
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      box-shadow: 0 5px 12px rgba(0, 0, 0, .25);
    }

    .marker.restaurant { background: var(--food); }
    .marker.fast { background: var(--fast); }
    .marker.cafe { background: var(--cafe); }
    .marker.leisure { background: var(--leisure); }
    .marker.brunch { background: #5f6f27; }
    .marker.drinks { background: #7f3b63; }

    .marker.visited {
      background: #6f7a74;
      opacity: .72;
    }

    @media (min-width: 820px) {
      body { overflow: hidden; }

      .app {
        grid-template-columns: minmax(420px, 35vw) 1fr;
        grid-template-rows: 100svh;
      }

      #map {
        grid-column: 2;
        grid-row: 1;
      }

      .panel {
        grid-column: 1;
        grid-row: 1;
        margin-top: 0;
        border-radius: 0;
        border-top: 0;
        border-right: 1px solid var(--line);
        box-shadow: 8px 0 22px rgba(23, 32, 29, .10);
      }

      .panel::before { display: none; }

      header { padding-top: 18px; }
    }
  </style>
</head>

      <header>

        <div class="search-row">

          <button id="locate" class="locate" type="button" title="Meine Position">◎</button>
        </div>
      </header>

      <div class="filters">
        <select id="city" class="select" aria-label="Ort filtern">

        </select>
        <div class="chips" id="categoryChips" aria-label="Kategorien"></div>
        <div class="chips" id="tagChips" aria-label="Angebote"></div>
        <div class="chips" id="visitedChips" aria-label="Besucht-Status"></div>
      </div>

      <section class="results" id="results" aria-live="polite"></section>
    </section>
    <div id="map" aria-label="Karte"></div>
  </main>

      return value.replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"

    }

    function markerClass(category) {
      if (category === "Restaurant") return "restaurant";
      if (category === "Schnellrestaurant") return "fast";
      if (category === "Café/Eiscafé") return "cafe";
      if (category === "Frühstück/Brunch") return "brunch";
      if (category === "Schlürfen") return "drinks";
      return "leisure";
    }

    function categoryInitial(category) {
      return {
        "Restaurant": "R",
        "Schnellrestaurant": "S",
        "Frühstück/Brunch": "B",
        "Café/Eiscafé": "C",
        "Schlürfen": "D",
        "Freizeit": "F"
      }[category] || "•";
    }

    function offsetCoords(place, index) {
      const base = CITY_COORDS[place.city] || [48.4011, 9.9876];
      const sameCity = PLACES.filter(item => item.city === place.city);
      const localIndex = sameCity.findIndex(item => item === place);
      const angle = (localIndex * 137.508) * Math.PI / 180;
      const radius = Math.min(0.018, 0.004 + Math.floor(localIndex / 6) * 0.003);
      return [
        base[0] + Math.sin(angle) * radius,
        base[1] + Math.cos(angle) * radius
      ];
    }

    PLACES.forEach((place, index) => {
      place.id = index;
      place.key = `${index}:${place.name}:${place.city}`;
      place.coords = offsetCoords(place, index);
      place.tagList = tagList(place.tags);
      place.searchText = [place.name, place.city, place.category, place.tags].join(" ").toLowerCase();
    });

    function haversineKm(a, b) {
      const toRad = value => value * Math.PI / 180;
      const R = 6371;
      const dLat = toRad(b[0] - a[0]);
      const dLon = toRad(b[1] - a[1]);
      const lat1 = toRad(a[0]);
      const lat2 = toRad(b[0]);
      const x = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(x));
    }

    function getFiltered() {
      let items = PLACES.filter(place => {
        const matchesQuery = !state.query || place.searchText.includes(state.query);
        const matchesCity = !state.city || place.city === state.city;
        const matchesCategory = !state.category || place.category === state.category;
        const matchesTag = !state.tag || place.tagList.includes(state.tag);
        const isVisited = visited.has(place.key);
        const matchesVisited = !state.visitedFilter ||
          (state.visitedFilter === "open" && !isVisited) ||
          (state.visitedFilter === "visited" && isVisited);
        return matchesQuery && matchesCity && matchesCategory && matchesTag && matchesVisited;
      });

      if (state.userLocation) {
        items = items
          .map(place => ({ ...place, distance: haversineKm(state.userLocation, place.coords) }))
          .sort((a, b) => a.distance - b.distance);
      } else {
        items = items.sort((a, b) => a.city.localeCompare(b.city, "de") || a.name.localeCompare(b.name, "de"));
      }
      return items;
    }

    function renderChips(container, values, activeValue, handler, labelMap = {}) {
      container.innerHTML = "";
      values.forEach(value => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `chip${activeValue === value ? " active" : ""}`;
        button.textContent = labelMap[value] || value;
        button.addEventListener("click", () => handler(activeValue === value ? "" : value));
        container.append(button);
      });
    }

    function mapsUrl(place) {
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${place.name}, ${place.city}`)}`;
    }

    function markerIcon(place) {
      const cls = markerClass(place.category);
      const isVisited = visited.has(place.key);
      return L.divIcon({
        className: "",
        html: `<span class="marker ${cls}${isVisited ? " visited" : ""}">${isVisited ? "✓" : categoryInitial(place.category)}</span>`,
        iconSize: [30, 30],
        iconAnchor: [15, 15],
        popupAnchor: [0, -15]
      });
    }

    function popupHtml(place) {
      const tags = place.tagList.map(tag => `<span class="badge ${tag === "NEU" ? "new" : ""}">${escapeHtml(TAG_LABELS[tag] || tag)}</span>`).join(" ");
      const isVisited = visited.has(place.key);
      return `
        <div class="popup">
          <strong>${escapeHtml(place.name)}</strong>
          <div>${escapeHtml(place.city)} · ${escapeHtml(place.category)}</div>
          <div class="meta" style="margin-top:7px">${tags || escapeHtml(place.tags)}</div>
          <button class="visited-toggle" style="margin-top:9px;width:auto;padding:0 12px;display:inline-flex;gap:7px" type="button" aria-pressed="${isVisited}" onclick="toggleVisited(${place.id})">
            ${isVisited ? "✓ Besucht" : "Abhaken"}
          </button>
          <a href="${mapsUrl(place)}" target="_blank" rel="noreferrer">Exakt suchen</a>
        </div>
      `;
    }

    function renderMarkers(items) {
      markerLayer.clearLayers();
      items.forEach(place => {
        const marker = L.marker(place.coords, { icon: markerIcon(place) })
          .bindPopup(popupHtml(place))
          .addTo(markerLayer);
        place.marker = marker;
      });

      if (items.length) {
        const bounds = L.latLngBounds(items.map(place => place.coords));
        map.fitBounds(bounds.pad(0.18), { animate: true, maxZoom: 12 });
      }
    }

    function renderResults(items) {
      el.count.textContent = `${items.length} Treffer`;
      el.results.innerHTML = "";
      if (!items.length) {
        el.results.innerHTML = `<div class="empty">Keine Treffer für diese Filter.</div>`;
        return;
      }

      items.forEach(place => {
        const item = document.createElement("article");
        const isVisited = visited.has(place.key);
        item.className = `result${isVisited ? " visited" : ""}`;
        item.innerHTML = `
          <span class="stripe" style="background: ${stripeColor(place.category)}"></span>
          <div>
            <h2>${escapeHtml(place.name)}</h2>
            <div class="meta">
              <span>${escapeHtml(place.city)}</span>
              <span>·</span>
              <span>${escapeHtml(place.category)}</span>
              ${typeof place.distance === "number" ? `<span>·</span><span>${place.distance.toFixed(1)} km</span>` : ""}
            </div>
            <div class="meta" style="margin-top:7px">
              ${place.tagList.map(tag => `<span class="badge ${tag === "NEU" ? "new" : ""}">${escapeHtml(TAG_LABELS[tag] || tag)}</span>`).join("")}
            </div>
          </div>
          <button class="visited-toggle" type="button" aria-label="${escapeHtml(place.name)} als besucht markieren" aria-pressed="${isVisited}" data-visited-id="${place.id}">
            ${isVisited ? "✓" : ""}
          </button>
        `;
        item.addEventListener("click", () => {
          map.setView(place.coords, 14, { animate: true });
          place.marker.openPopup();
        });
        item.querySelector("[data-visited-id]").addEventListener("click", event => {
          event.stopPropagation();
          toggleVisited(place.id);
        });
        el.results.append(item);
      });
    }

    function persistVisited() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify([...visited]));
    }

    function toggleVisited(id) {
      const place = PLACES.find(item => item.id === id);
      if (!place) return;
      if (visited.has(place.key)) {
        visited.delete(place.key);
      } else {
        visited.add(place.key);
      }
      persistVisited();
      render();
    }

    window.toggleVisited = toggleVisited;

    function stripeColor(category) {
      return {
        "Restaurant": "var(--food)",
        "Schnellrestaurant": "var(--fast)",
        "Café/Eiscafé": "var(--cafe)",
        "Frühstück/Brunch": "#5f6f27",
        "Schlürfen": "#7f3b63",
        "Freizeit": "var(--leisure)"
      }[category] || "var(--accent)";
    }

    function render() {
      const items = getFiltered();
      renderMarkers(items);
      renderResults(items);
    }

    function initControls() {
      const cities = [...new Set(PLACES.map(place => place.city))].sort((a, b) => a.localeCompare(b, "de"));
      cities.forEach(city => {
        const option = document.createElement("option");
        option.value = city;
        option.textContent = city;
        el.city.append(option);
      });

      const categories = ["Restaurant", "Schnellrestaurant", "Frühstück/Brunch", "Café/Eiscafé", "Schlürfen", "Freizeit"];
      const tags = ["NEU", "MG", "A", "SI", "FA", "4:2", "MT", "VKS", "ME"];
      const tagHandler = value => {
        state.tag = value;
        renderChips(el.tagChips, tags, state.tag, tagHandler, TAG_LABELS);
        render();
      };
      const categoryHandler = value => {
        state.category = value;
        renderChips(el.categoryChips, categories, state.category, categoryHandler);
        render();
      };
      renderChips(el.categoryChips, categories, state.category, categoryHandler);
      renderChips(el.tagChips, tags, state.tag, tagHandler, TAG_LABELS);

      const visitedOptions = ["open", "visited"];
      const visitedLabels = { open: "Noch offen", visited: "Besucht" };
      const visitedHandler = value => {
        state.visitedFilter = value;
        renderChips(el.visitedChips, visitedOptions, state.visitedFilter, visitedHandler, visitedLabels);
        render();
      };
      renderChips(el.visitedChips, visitedOptions, state.visitedFilter, visitedHandler, visitedLabels);
    }

    el.search.addEventListener("input", event => {
      state.query = event.target.value.trim().toLowerCase();
      render();
    });

    el.city.addEventListener("change", event => {
      state.city = event.target.value;
      render();
    });

    el.locate.addEventListener("click", () => {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(position => {
        state.userLocation = [position.coords.latitude, position.coords.longitude];
        L.circleMarker(state.userLocation, {
          radius: 8,
          color: "#0e7662",
          fillColor: "#0e7662",
          fillOpacity: .9
        }).addTo(map).bindPopup("Deine Position");
        render();
      });
    });

    initControls();
    render();
  </script>
</body>
</html>
