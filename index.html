<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Schlemmerblock 2026</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Schlemmerblock 2026">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f2f6f3">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      color-scheme: light;
      --ink: #17201d;
      --muted: #65706b;
      --line: #dbe4df;
      --surface: #ffffff;
      --soft: #f2f6f3;
      --accent: #0e7662;
      --accent-2: #a54816;
      --leisure: #315f9d;
      --food: #b63f32;
      --cafe: #7c4f1d;
      --fast: #287056;
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--soft);
      overflow: hidden;
    }

    .app {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100svh;
    }

    #map {
      grid-row: 2;
      width: 100%;
      height: 100%;
      background: #dce7e0;
      z-index: 1;
    }

    .panel {
      grid-row: 1;
      z-index: 2;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 6px 18px rgba(23, 32, 29, .08);
    }

    header {
      padding: 0 14px 10px;
      border-bottom: 1px solid var(--line);
      flex: 0 0 auto;
    }

    .title-row {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      font-size: 1.08rem;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .count {
      min-width: max-content;
      color: var(--muted);
      font-weight: 700;
      font-size: .85rem;
    }

    input, select, button {
      font: inherit;
    }

    .locate {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--accent);
      font-weight: 900;
    }

    .locate-icon {
      display: inline-block;
      transform: rotate(-45deg);
      font-size: 1rem;
      line-height: 1;
    }

    .filters {
      display: grid;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      flex: 0 0 auto;
    }

    .filter-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .chips {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      padding-bottom: 2px;
      flex: 1 1 auto;
    }

    .chip {
      flex: 0 0 auto;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 11px;
      background: #fff;
      color: var(--ink);
      font-weight: 700;
      font-size: .82rem;
      white-space: nowrap;
    }

    .chip.active {
      border-color: var(--accent);
      background: #e2f3ed;
      color: #075744;
    }

    .meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 5px;
      color: var(--muted);
      font-size: .8rem;
      line-height: 1.25;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 22px;
      border-radius: 999px;
      padding: 2px 8px;
      background: var(--soft);
      color: var(--ink);
      font-size: .74rem;
      font-weight: 800;
    }

    .badge.new { background: #fff0df; color: var(--accent-2); }

    .visited-toggle {
      display: inline-grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      font-weight: 900;
      cursor: pointer;
      flex: 0 0 auto;
    }

    .visited-toggle[aria-pressed="true"] {
      border-color: var(--accent);
      background: #dff2eb;
      color: #075744;
    }

    .leaflet-popup-content-wrapper {
      border-radius: var(--radius);
    }

    .popup {
      min-width: 210px;
    }

    .popup strong {
      display: block;
      margin-bottom: 4px;
      line-height: 1.2;
    }

    .popup a {
      display: inline-flex;
      margin-top: 9px;
      color: var(--accent);
      font-weight: 800;
      text-decoration: none;
    }

    .marker {
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border: 2px solid #fff;
      border-radius: 999px;
      color: #fff;
      font-size: 12px;
      font-weight: 900;
      box-shadow: 0 5px 12px rgba(0, 0, 0, .25);
    }

    .marker.restaurant { background: var(--food); }
    .marker.fast { background: var(--fast); }
    .marker.cafe { background: var(--cafe); }
    .marker.leisure { background: var(--leisure); }
    .marker.brunch { background: #5f6f27; }
    .marker.drinks { background: #7f3b63; }

    .marker.visited {
      background: #6f7a74;
      opacity: .72;
    }

    @media (min-width: 820px) {
      body { overflow: hidden; }

      .app {
        grid-template-rows: auto 1fr;
      }

      #map {
        grid-row: 2;
      }

      .panel {
        grid-row: 1;
        box-shadow: 0 6px 18px rgba(23, 32, 29, .08);
      }

      header { padding-top: 18px; }
    }
  </style>
</head>

      "Dida Eismanufaktur|||Senden": { address: "Hauptstraße 32, 89250 Senden", coords: [48.3241012, 10.0444124] },
      "Café & Bistro klein & fein|||Oberdischingen": { address: "Schlossplatz 3, 89610 Oberdischingen", coords: [48.3013965, 9.8321786] },
      "AM Café Bar|||Illertissen": { address: "Bräuhausstraße 2, 89257 Illertissen", coords: [48.2214634, 10.1067353] },
      "Café Schneewittchen|||Illertissen": { address: "Hauptstraße 1, 89257 Illertissen", coords: [48.2226983, 10.1041782] },
      "Goldener Bock Eventlocation & Cocktailbar|||Ulm": { address: "Bockgasse 25, 89073 Ulm", coords: [48.3996184, 9.9986759] }
    };

    const CITY_COORDS = {
      "Aalen": [48.8378, 10.0933],
      "Amstetten": [48.5785, 9.8731],
      "Augsburg": [48.3705, 10.8978],
      "Bellenberg": [48.2580, 10.0908],
      "Blaubeuren": [48.4124, 9.7848],
      "Blaustein": [48.4160, 9.9085],
      "Bottrop": [51.5291, 6.9447],
      "Burgau": [48.4315, 10.4099],
      "Dasing": [48.3848, 11.0467],
      "Dornstadt": [48.4663, 9.9442],
      "Ehingen": [48.2826, 9.7275],
      "Erbach": [48.3282, 9.8876],
      "Geislingen an der Steige": [48.6242, 9.8274],
      "Giengen": [48.6224, 10.2439],
      "Göppingen": [48.7035, 9.6521],
      "Gundelfingen": [48.5537, 10.3729],
      "Günzburg": [48.4550, 10.2766],
      "Illertissen": [48.2230, 10.1042],
      "Jettingen-Scheppach": [48.3892, 10.4385],
      "Krumbach (Schwaben)": [48.2456, 10.3630],
      "Lauingen": [48.5679, 10.4270],
      "Laupheim": [48.2279, 9.8785],
      "Leipheim": [48.4484, 10.2226],
      "Meckenbeuren": [47.7005, 9.5619],
      "Medlingen": [48.5707, 10.3161],
      "Munderkingen": [48.2356, 9.6439],
      "Neu-Ulm": [48.3928, 10.0111],
      "Oberdischingen": [48.3030, 9.8344],
      "Oberstadion": [48.1855, 9.6906],
      "Schelklingen": [48.3753, 9.7326],
      "Senden": [48.3244, 10.0443],
      "Ulm": [48.4011, 9.9876],
      "Ulm-Weststadt": [48.3977, 9.9677],
      "Vöhringen": [48.2782, 10.0837],
      "Weißenhorn": [48.3050, 10.1601],
      "Westerheim": [48.5146, 9.6244]
    };

    const TAG_LABELS = {
      "NEU": "Neu",
      "MG": "Mobil",
      "A": "Abholung",
      "SI": "Single",
      "FA": "Family",
      "4:2": "Friends",
      "MT": "Mittag",
      "VKS": "Verkauf",
      "ME": "Mind. 30%"
    };

    const state = {
      categories: [],
      tags: [],
      userLocation: null
    };

    const STORAGE_KEY = "schlemmerblock.visited.v1";
    const safeStorage = {
      get(key) {
        try {
          return window.localStorage.getItem(key);
        } catch {
          return null;
        }
      },
      set(key, value) {
        try {
          window.localStorage.setItem(key, value);
        } catch {
          // Ignore storage failures for file:// or strict privacy modes.
        }
      }
    };
    const visited = new Set(JSON.parse(safeStorage.get(STORAGE_KEY) || "[]"));

    const DEFAULT_CENTER = [48.4011, 9.9876];
    const DEFAULT_ZOOM = 11;
    const map = L.map("map", { zoomControl: false }).setView(DEFAULT_CENTER, DEFAULT_ZOOM);
    L.control.zoom({ position: "topright" }).addTo(map);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    const markerLayer = L.layerGroup().addTo(map);
    const el = {
      app: document.querySelector(".app"),
      count: document.querySelector("#count"),
      categoryChips: document.querySelector("#categoryChips"),
      locate: document.querySelector("#locate")
    };

    function escapeHtml(value) {
      return value.replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
      }[char]));
    }

    function tagList(tags) {
      const found = [];
      Object.keys(TAG_LABELS).forEach(tag => {
        if (tags.includes(tag)) found.push(tag);
      });
      if (tags.includes("Geheimtipp")) found.push("Geheimtipp");
      return found;
    }

    function markerClass(category) {
      if (category === "Restaurant") return "restaurant";
      if (category === "Schnellrestaurant") return "fast";
      if (category === "Café/Eiscafé") return "cafe";
      if (category === "Frühstück/Brunch") return "brunch";
      if (category === "Schlürfen") return "drinks";
      return "leisure";
    }

    function categoryInitial(category) {
      return {
        "Restaurant": "R",
        "Schnellrestaurant": "S",
        "Frühstück/Brunch": "B",
        "Café/Eiscafé": "C",
        "Schlürfen": "D",
        "Freizeit": "F"
      }[category] || "•";
    }

    function offsetCoords(place, index) {
      const base = CITY_COORDS[place.city] || [48.4011, 9.9876];
      const sameCity = PLACES.filter(item => item.city === place.city);
      const localIndex = sameCity.findIndex(item => item === place);
      const angle = (localIndex * 137.508) * Math.PI / 180;
      const radius = Math.min(0.018, 0.004 + Math.floor(localIndex / 6) * 0.003);
      return [
        base[0] + Math.sin(angle) * radius,
        base[1] + Math.cos(angle) * radius
      ];
    }

    PLACES.forEach((place, index) => {
      const detail = PLACE_DETAILS[`${place.name}|||${place.city}`];
      place.id = index;
      place.key = `${index}:${place.name}:${place.city}`;
      place.address = detail?.address || "";
      place.coords = detail?.coords || offsetCoords(place, index);
      place.tagList = tagList(place.tags);
      place.searchText = [place.name, place.city, place.category, place.tags, place.address].join(" ").toLowerCase();
    });

    function haversineKm(a, b) {
      const toRad = value => value * Math.PI / 180;
      const R = 6371;
      const dLat = toRad(b[0] - a[0]);
      const dLon = toRad(b[1] - a[1]);
      const lat1 = toRad(a[0]);
      const lat2 = toRad(b[0]);
      const x = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(x));
    }

    function getFiltered() {
      let items = PLACES.filter(place => {
        const matchesCategory = state.categories.length === 0 || state.categories.includes(place.category);
        const matchesTag = state.tags.length === 0 || state.tags.some(tag => place.tagList.includes(tag));
        return matchesCategory && matchesTag;
      });

      if (state.userLocation) {
        items = items
          .map(place => ({ ...place, distance: haversineKm(state.userLocation, place.coords) }))
          .sort((a, b) => a.distance - b.distance);
      } else {
        items = items.sort((a, b) => a.city.localeCompare(b.city, "de") || a.name.localeCompare(b.name, "de"));
      }
      return items;
    }

    function renderChips(container, values, activeValue, handler, labelMap = {}) {
      container.innerHTML = "";
      values.forEach(value => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `chip${activeValue === value ? " active" : ""}`;
        button.textContent = labelMap[value] || value;
        button.addEventListener("click", () => handler(activeValue === value ? "" : value));
        container.append(button);
      });
    }

    function renderFilterChips() {
      const categories = ["Restaurant", "Schnellrestaurant", "Frühstück/Brunch", "Café/Eiscafé", "Schlürfen", "Freizeit"];
      const filters = [
        ...categories.map(value => ({ value, label: value, kind: "category" })),
        { value: "NEU", label: TAG_LABELS.NEU, kind: "tag" }
      ];

      el.categoryChips.innerHTML = "";
      filters.forEach(filter => {
        const active = filter.kind === "category"
          ? state.categories.includes(filter.value)
          : state.tags.includes(filter.value);
        const button = document.createElement("button");
        button.type = "button";
        button.className = `chip${active ? " active" : ""}`;
        button.textContent = filter.label;
        button.addEventListener("click", () => {
          if (filter.kind === "category") {
            state.categories = state.categories.includes(filter.value)
              ? state.categories.filter(value => value !== filter.value)
              : [...state.categories, filter.value];
          } else {
            state.tags = state.tags.includes(filter.value)
              ? state.tags.filter(value => value !== filter.value)
              : [...state.tags, filter.value];
          }
          renderFilterChips();
          render();
        });
        el.categoryChips.append(button);
      });
    }

    function mapsUrl(place) {
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place.address ? `${place.name}, ${place.address}` : `${place.name}, ${place.city}`)}`;
    }

    function markerIcon(place) {
      const cls = markerClass(place.category);
      const isVisited = visited.has(place.key);
      return L.divIcon({
        className: "",
        html: `<span class="marker ${cls}${isVisited ? " visited" : ""}">${isVisited ? "✓" : categoryInitial(place.category)}</span>`,
        iconSize: [30, 30],
        iconAnchor: [15, 15],
        popupAnchor: [0, -15]
      });
    }

    function popupHtml(place) {
      const tags = place.tagList.map(tag => `<span class="badge ${tag === "NEU" ? "new" : ""}">${escapeHtml(TAG_LABELS[tag] || tag)}</span>`).join(" ");
      const isVisited = visited.has(place.key);
      return `
        <div class="popup">
          <strong>${escapeHtml(place.name)}</strong>
          <div>${escapeHtml(place.city)} · ${escapeHtml(place.category)}</div>
          ${place.address ? `<div style="margin-top:4px">${escapeHtml(place.address)}</div>` : ""}
          <div class="meta" style="margin-top:7px">${tags || escapeHtml(place.tags)}</div>
          <button class="visited-toggle" style="margin-top:9px;width:auto;padding:0 12px;display:inline-flex;gap:7px" type="button" aria-pressed="${isVisited}" onclick="toggleVisited(${place.id})">
            ${isVisited ? "✓ Besucht" : "Abhaken"}
          </button>
          <a href="${mapsUrl(place)}" target="_blank" rel="noreferrer">Exakt suchen</a>
        </div>
      `;
    }

    function renderMarkers(items) {
      markerLayer.clearLayers();
      items.forEach(place => {
        const marker = L.marker(place.coords, { icon: markerIcon(place) })
          .bindPopup(popupHtml(place))
          .addTo(markerLayer);
        place.marker = marker;
      });

      const hasActiveFilters = Boolean(state.categories.length || state.tags.length || state.userLocation);
      if (!items.length) return;

      if (!hasActiveFilters) {
        map.setView(DEFAULT_CENTER, DEFAULT_ZOOM, { animate: true });
      } else {
        const bounds = L.latLngBounds(items.map(place => place.coords));
        map.fitBounds(bounds.pad(0.18), { animate: true, maxZoom: 12 });
      }
    }

    function persistVisited() {
      safeStorage.set(STORAGE_KEY, JSON.stringify([...visited]));
    }

    function toggleVisited(id) {
      const place = PLACES.find(item => item.id === id);
      if (!place) return;
      if (visited.has(place.key)) {
        visited.delete(place.key);
      } else {
        visited.add(place.key);
      }
      persistVisited();
      render();
    }

    window.toggleVisited = toggleVisited;

    function render() {
      const items = getFiltered();
      el.count.textContent = `${items.length} Treffer`;
      renderMarkers(items);
    }

    function initControls() {
      renderFilterChips();
    }

    el.locate.addEventListener("click", () => {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(position => {
        state.userLocation = [position.coords.latitude, position.coords.longitude];
        L.circleMarker(state.userLocation, {
          radius: 8,
          color: "#0e7662",
          fillColor: "#0e7662",
          fillOpacity: .9
        }).addTo(map).bindPopup("Deine Position");
        render();
      });
    });

    initControls();
    render();
  </script>
</body>
